<svg xmlns="http://www.w3.org/2000/svg" width="480" height="490" viewBox="0 0 480 490" role="img" aria-labelledby="title desc">
  <title id="title">A media player with parallel playback and sound regions</title>
  <desc id="desc">Loaded contains two active regions. Playback has Playing active and Paused inactive. Sound has Audible inactive and Muted active. This is one state configuration, with transitions omitted.</desc>
  <rect width="480" height="490" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" fill="#0f172a">
    <text x="20" y="40" font-size="22" font-weight="600">One active configuration</text>
    <rect x="20" y="64" width="440" height="372" rx="14" fill="#fff" stroke="#475569" stroke-width="2"/>
    <text x="40" y="102" font-size="24" font-weight="600">Loaded</text>
    <text x="40" y="143" font-size="22" font-weight="600">Playback</text>
    <rect x="40" y="162" width="184" height="78" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <text x="60" y="195" font-size="22" font-weight="600">Playing</text>
    <text x="60" y="222" font-size="18" fill="#1e40af">Active</text>
    <rect x="256" y="162" width="184" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="276" y="209" font-size="22">Paused</text>
    <path d="M32 264H448" stroke="#64748b" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="40" y="303" font-size="22" font-weight="600">Sound</text>
    <rect x="40" y="322" width="184" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="60" y="369" font-size="22">Audible</text>
    <rect x="256" y="322" width="184" height="78" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <text x="276" y="355" font-size="22" font-weight="600">Muted</text>
    <text x="276" y="382" font-size="18" fill="#1e40af">Active</text>
    <text x="20" y="470" font-size="18">Playback and Sound are active together.</text>
  </g>
</svg>
